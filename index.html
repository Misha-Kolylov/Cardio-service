<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12161c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cardio Service — ПТО тренажёров</title>

  <!-- ==================== ВСТРОЕННЫЙ МАНИФЕСТ ==================== -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Cardio Service","short_name":"CardioSrv","description":"Обслуживание кардиотренажёров","start_url":".","display":"standalone","background_color":"%2312161c","theme_color":"%2312161c","orientation":"any","icons":[{"src":"data:image/svg%2Bxml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjM4IiBmaWxsPSIjMTIxNjFjIi8+PHBhdGggZD0iTTUwIDExMGgxOHYyMkg1MHptMzIgMGgxOHYyMkg4MnptMzIgMGgxOHYyMkgxMTR6bS02NC02MGgxOHYyMkg1MHptMzIgMGgxOHYyMkg4MnptMzIgMGgxOHYyMkgxMTR6IiBmaWxsPSIjM2JhNTVhIi8+PHBhdGggZD0iTTUwIDgwaDkydjEwSDUweiIgZmlsbD0iI2ZmY2M0ZCIvPjwvc3ZnPg==","sizes":"192x192","type":"image/svg+xml"}]}' />

  <style>
    /* ============================================================
       БАЗОВЫЕ ПЕРЕМЕННЫЕ И СБРОС
       ============================================================ */
    :root {
      --bg: #12161c;
      --bg-2: #1a2029;
      --bg-3: #232b36;
      --card: #1e2732;
      --border: #2f3a47;
      --text: #e8edf3;
      --text-dim: #8b97a6;
      --accent: #3b8eea;
      --accent-2: #2f6fbb;
      --green: #38b06a;
      --yellow: #e0a72e;
      --red: #e05050;
      --radius: 14px;
      --tap: 48px; /* минимальный размер для пальца */
      --grid: 28px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      overscroll-behavior: none;
      height: 100%;
    }
    body { display: flex; flex-direction: column; }
    button, input, select, textarea {
      font-family: inherit; font-size: 16px; color: var(--text);
    }
    button { cursor: pointer; }

    /* ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ
       ============================================================ */
    header.appbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      flex-wrap: wrap;
    }
    .appbar .logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 15px; letter-spacing: .3px;
    }
    .appbar .logo svg { width: 26px; height: 26px; flex: 0 0 auto; }
    .mode-switch {
      display: flex; background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; gap: 3px;
    }
    .mode-switch button {
      border: none; background: transparent; color: var(--text-dim);
      padding: 10px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
      min-height: 40px; white-space: nowrap;
    }
    .mode-switch button.active { background: var(--accent); color: #fff; }

    /* ============================================================
       ОСНОВНОЙ КОНТЕЙНЕР
       ============================================================ */
    main {
      flex: 1 1 auto;
      display: flex; flex-direction: column;
      padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ============================================================
       КАРТА ЗАЛА
       ============================================================ */
    .map-wrap {
      position: relative;
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      flex: 1 1 auto;
      min-height: 340px;
      touch-action: none; /* важно: карта сама управляет жестами */
    }
    /* Сетка зала */
    .map-wrap::before {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      z-index: 0;
    }
    .map-hint {
      position: absolute; left: 10px; bottom: 8px;
      font-size: 11px; color: var(--text-dim); opacity: .8;
      pointer-events: none; z-index: 1;
      background: rgba(18,22,28,.65); padding: 3px 8px; border-radius: 8px;
    }

    /* Карточка тренажёра на карте */
    .equip {
      position: absolute;
      width: 84px;
      min-height: 66px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      padding: 6px 4px 5px;
      z-index: 2;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: box-shadow .15s, transform .08s;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
    }
    .equip .ico { font-size: 20px; line-height: 1; }
    .equip .name {
      font-size: 10px; font-weight: 700; text-align: center;
      line-height: 1.12; color: var(--text);
      max-width: 100%; overflow: hidden;
    }
    .equip .status-dot {
      position: absolute; top: -5px; right: -5px;
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--bg-2);
    }
    .equip .status-dot.green { background: var(--green); }
    .equip .status-dot.yellow { background: var(--yellow); }
    .equip .status-dot.red { background: var(--red); }
    /* В режиме настройки — пунктирная рамка и «ручка» перемещения */
    body.mode-setup .equip {
      border-style: dashed;
      cursor: grab;
      box-shadow: 0 0 0 2px rgba(59,142,234,.25), 0 2px 6px rgba(0,0,0,.4);
    }
    body.mode-setup .equip:active { cursor: grabbing; }
    .equip.dragging { z-index: 50; transform: scale(1.06); box-shadow: 0 8px 22px rgba(0,0,0,.6); }
    /* В рабочем режиме — курсор-указатель */
    body.mode-work .equip { cursor: pointer; }
    body.mode-work .equip:active { transform: scale(.96); }

    /* ============================================================
       ПАНЕЛЬ НАСТРОЕК
       ============================================================ */
    .setup-panel { display: flex; flex-direction: column; gap: 10px; }
    .setup-panel[hidden] { display: none; }
    .panel {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .panel h3 {
      margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-dim); font-weight: 700;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 140px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: var(--tap); padding: 0 16px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 12px; font-weight: 600; font-size: 15px;
    }
    .btn:active { background: var(--accent-2); }
    .btn.secondary { background: var(--bg-3); border: 1px solid var(--border); color: var(--text); }
    .btn.secondary:active { background: var(--border); }
    .btn.danger { background: var(--red); }
    .btn.danger:active { background: #b83c3c; }
    .btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 10px; }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%; min-height: var(--tap);
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px; color: var(--text);
      outline: none;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 84px; }
    label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); }

    /* Список тренажёров в настройках */
    .list { display: flex; flex-direction: column; gap: 6px; }
    .list-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 10px;
      min-height: var(--tap);
    }
    .list-item .li-ico { font-size: 18px; }
    .list-item .li-name { flex: 1 1 auto; font-size: 14px; font-weight: 600; }
    .list-item .li-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-2); color: var(--text); font-size: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { background: var(--border); }

    /* Чек-лист шаблонов ПТО */
    .tmpl-block { margin-bottom: 14px; }
    .tmpl-block .tmpl-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 14px; font-weight: 700; margin-bottom: 6px;
    }
    .tmpl-item {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .tmpl-item input[type="text"] { min-height: 40px; padding: 6px 10px; font-size: 14px; }
    .tmpl-item .icon-btn { flex: 0 0 40px; width: 40px; height: 40px; }

    /* ============================================================
       МОДАЛЬНОЕ ОКНО КАРТОЧКИ ТРЕНАЖЁРА
       ============================================================ */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 200; display: flex; align-items: flex-end; justify-content: center;
      padding: 0;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: 100%; max-width: 560px;
      max-height: 92vh; max-height: 92dvh;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: slideUp .2s ease-out;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
    .modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
    }
    .modal-head .mh-ico { font-size: 26px; }
    .modal-head .mh-title { flex: 1 1 auto; }
    .modal-head .mh-title .t1 { font-size: 16px; font-weight: 700; }
    .modal-head .mh-title .t2 { font-size: 12px; color: var(--text-dim); }
    .modal-body {
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 14px 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    /* Переключатель типа события */
    .seg {
      display: flex; background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; gap: 3px;
    }
    .seg button {
      flex: 1 1 0; min-height: 44px; border: none; background: transparent;
      color: var(--text-dim); border-radius: 9px; font-weight: 700; font-size: 14px;
      padding: 0 8px;
    }
    .seg button.active { background: var(--accent); color: #fff; }

    /* Чек-лист */
    .check-list { display: flex; flex-direction: column; gap: 6px; }
    .check-item {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 12px;
      min-height: var(--tap);
      cursor: pointer;
    }
    .check-item input[type="checkbox"] {
      width: 22px; height: 22px; flex: 0 0 auto; margin: 1px 0 0;
      accent-color: var(--accent); border-radius: 6px;
      pointer-events: none; /* кликаем по всей строке */
    }
    .check-item span { font-size: 14px; line-height: 1.35; }
    .check-item.checked { border-color: var(--green); background: rgba(56,176,106,.08); }

    /* История */
    .history { display: flex; flex-direction: column; gap: 8px; }
    .hist-item {
      background: var(--bg-2); border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px; padding: 10px 12px;
    }
    .hist-item.repair { border-left-color: var(--red); }
    .hist-item .hi-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 13px; margin-bottom: 4px;
    }
    .hist-item .hi-type { font-weight: 700; }
    .hist-item .hi-type.repair { color: var(--red); }
    .hist-item .hi-date { color: var(--text-dim); font-size: 12px; }
    .hist-item ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
    .hist-item ul li { margin-bottom: 2px; }
    .hist-item .hi-comment {
      margin-top: 6px; font-size: 13px; color: var(--text-dim);
      border-top: 1px dashed var(--border); padding-top: 6px;
      white-space: pre-wrap; word-break: break-word;
    }
    .empty-note { color: var(--text-dim); font-size: 13px; text-align: center; padding: 14px 0; }

    /* Нижняя панель действий в модале */
    .modal-actions {
      display: flex; gap: 8px; padding: 10px 0 0;
    }
    .modal-actions .btn { flex: 1 1 0; }

    /* Тост-уведомления */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      transform: translateX(-50%) translateY(20px);
      background: #2b3644; color: #fff; border: 1px solid #3d4a5c;
      padding: 12px 18px; border-radius: 12px; font-size: 14px;
      z-index: 500; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Скроллбары */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Альбомная ориентация: карта повыше, настройки в две колонки */
    @media (orientation: landscape) and (max-height: 520px) {
      .map-wrap { min-height: 220px; }
      .appbar .logo span { display: none; }
    }
  </style>
</head>
<body class="mode-work">

  <!-- ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ С ПЕРЕКЛЮЧАТЕЛЕМ РЕЖИМОВ
       ============================================================ -->
  <header class="appbar">
    <div class="logo">
      <!-- Иконка-сердце с пульсом -->
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1e2732" stroke="#2f3a47"/>
        <path d="M6 17h4l2-5 3 10 2.5-7 1.5 2h5" stroke="#38b06a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Cardio&nbsp;Service</span>
    </div>
    <div class="mode-switch" role="tablist" aria-label="Режим работы">
      <button id="btnWork" class="active" role="tab" aria-selected="true">Рабочий</button>
      <button id="btnSetup" role="tab" aria-selected="false">Настройка</button>
    </div>
  </header>

  <main>
    <!-- ============================================================
         КАРТА ЗАЛА
         ============================================================ -->
    <div class="map-wrap" id="map">
      <div class="map-hint" id="mapHint">Нажмите на тренажёр, чтобы открыть карточку</div>
      <!-- Карточки тренажёров генерируются JS -->
    </div>

    <!-- ============================================================
         ПАНЕЛЬ НАСТРОЕК (видна только в режиме настройки)
         ============================================================ -->
    <section class="setup-panel" id="setupPanel" hidden>

      <!-- Управление парком -->
      <div class="panel">
        <h3>Парк оборудования</h3>
        <div class="list" id="equipList"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="btnAddEquip">➕ Добавить тренажёр</button>
        </div>
      </div>

      <!-- Редактор шаблонов ПТО -->
      <div class="panel">
        <h3>Шаблоны ПТО по типам</h3>
        <label class="field" style="margin-bottom:10px">
          Тип тренажёра
          <select id="tmplTypeSelect"></select>
        </label>
        <div id="tmplEditor"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn secondary small" id="btnAddTmplItem">➕ Добавить пункт</button>
        </div>
      </div>

      <!-- Резервное копирование -->
      <div class="panel">
        <h3>Резервное копирование</h3>
        <div class="row">
          <button class="btn secondary" id="btnExport">⬇ Экспорт (JSON)</button>
          <button class="btn secondary" id="btnImport">⬆ Импорт (JSON)</button>
        </div>
        <input type="file" id="fileImport" accept="application/json,.json" hidden />
        <p style="font-size:12px;color:var(--text-dim);margin:10px 0 0">
          Данные хранятся в памяти браузера (localStorage). Регулярно делайте резервную копию.
        </p>
      </div>

      <!-- Опасная зона -->
      <div class="panel">
        <h3>Сброс</h3>
        <button class="btn danger" id="btnResetAll">Сбросить все данные</button>
      </div>
    </section>
  </main>

  <!-- ============================================================
       МОДАЛЬНОЕ ОКНО КАРТОЧКИ ТРЕНАЖЁРА
       ============================================================ -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mhTitle">
      <div class="modal-head">
        <div class="mh-ico" id="mhIco">🏃</div>
        <div class="mh-title">
          <div class="t1" id="mhTitle">Тренажёр</div>
          <div class="t2" id="mhSub">—</div>
        </div>
        <button class="icon-btn" id="btnCloseModal" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body">
        <!-- Переключатель события -->
        <div class="seg" id="eventSeg">
          <button data-ev="pto" class="active">Плановое ТО</button>
          <button data-ev="repair">Ремонт / Поломка</button>
        </div>

        <!-- Блок ПТО: чек-лист -->
        <div id="ptoBlock">
          <div class="check-list" id="checkList"></div>
        </div>

        <!-- Блок ремонта: описание -->
        <div id="repairBlock" hidden>
          <label class="field">
            Что сломалось / какие работы проведены
            <textarea id="repairDesc" placeholder="Например: замена приводного ремня, люфт в левом шатуне…"></textarea>
          </label>
        </div>

        <!-- Обязательные поля -->
        <label class="field">
          Дата обслуживания
          <input type="date" id="eventDate" />
        </label>
        <label class="field">
          Комментарий инженера
          <textarea id="eventComment" placeholder="Состояние узлов, что заказать в следующий раз…"></textarea>
        </label>

        <div class="modal-actions">
          <button class="btn" id="btnSaveEvent">Сохранить запись</button>
        </div>

        <!-- История -->
        <div>
          <h3 style="margin:6px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim)">История обслуживания</h3>
          <div class="history" id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Тост -->
  <div class="toast" id="toast"></div>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
  (function () {
    "use strict";

    /* ==========================================================
       1. КОНСТАНТЫ И СПРАВОЧНИКИ
       ========================================================== */
    const LS_KEY = "cardioServiceData_v1"; // ключ localStorage

    // Типы тренажёров: ключ, название, иконка
    const TYPES = {
      treadmill:  { label: "Беговая дорожка",   ico: "🏃" },
      elliptical: { label: "Эллиптический",     ico: "🔄" },
      stepper:    { label: "Степпер",           ico: "🪜" },
      bike:       { label: "Велотренажёр",      ico: "🚴" }
    };

    // Стартовые шаблоны ПТО по типам
    const DEFAULT_TEMPLATES = {
      treadmill: [
        "Проверка натяжения и центровки полотна",
        "Смазка деки / полотна",
        "Очистка моторного отсека от пыли",
        "Проверка приводного ремня и роликов",
        "Протяжка крепежа"
      ],
      elliptical: [
        "Очистка и смазка направляющих / рельсов",
        "Проверка роликов и подшипников",
        "Протяжка шарнирных соединений и педалей",
        "Проверка приводного ремня"
      ],
      stepper: [

    let state = {
      equipment: [],
      templates: {},
      mode: "work",      // "work" | "setup"
      activeEquipId: null,
      eventType: "pto"   // "pto" | "repair"
    };

    // Загрузка из localStorage или инициализация
    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.equipment)) {
            state.equipment = parsed.equipment;
            state.templates = parsed.templates || JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
            return;
          }
        }
      } catch (e) {
        console.warn("Не удалось прочитать localStorage:", e);
      }
      // Первый запуск — стартовые данные
      state.equipment = buildInitialEquipment();
      state.templates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
      saveState();
    }

    // Сохранение в localStorage
    function saveState() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          equipment: state.equipment,
          templates: state.templates
        }));
      } catch (e) {
        console.error("Ошибка сохранения:", e);
        toast("Не удалось сохранить данные (память заполнена?)");
      }
    }

    function uid(prefix) {
      return (prefix || "id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    // Тост-уведомление
    let toastTimer = null;
    function toast(msg) {
      const el = $("#toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    // Сегодняшняя дата в формате YYYY-MM-DD (локально)
    function todayISO() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }

    // Формат даты для отображения
    function fmtDate(iso) {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      return d + "." + m + "." + y;
    }

    // Полное название тренажёра

      return eq.brand + " №" + eq.num;
